name: CI

on:
  push:
    branches:
      - main
  # Runs on pull requests to any base, so stacked PRs are checked before they retarget main.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changeset-check:
    name: Changeset Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      # The Version Packages PR consumes the changesets it releases, so the check cannot pass on it. A branch name
      # alone is no proof (anyone can push a changeset-release/* branch), so the PR must also come from the bot.
      - name: Check for changesets
        if: ${{ !(startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.user.login == 'csag-changesets-bot[bot]') }}
        run: npx changeset status --since=origin/${{ github.base_ref }}

  build:
    name: Build, Test & Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          # global.json pins the SDK; 8.x supplies the runtime the net8.0 test leg needs.
          global-json-file: global.json
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger trx --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./test-results
          retention-days: 7

      - name: Pack (smoke test)
        run: dotnet pack Csag.WorkloadIdentity --configuration Release --no-build -o ./nupkgs

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: ./nupkgs
          retention-days: 7

  docker:
    name: Docker (Demo image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build Demo image
        run: docker build -f Csag.WorkloadIdentity.Demo/Dockerfile -t csag-demo .

      # The library validates its settings at startup, so the container only reaches "/" with placeholder values.
      - name: Smoke test Demo image
        run: |
          docker run -d -p 8080:8080 --name csag-demo \
            -e Csag.WorkloadIdentity__TenantId=placeholder \
            -e Csag.WorkloadIdentity__ClientId=placeholder \
            -e Csag.WorkloadIdentity__Google__ServiceAccountEmail=placeholder@example.invalid \
            csag-demo
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-all-errors --retry-delay 1 http://localhost:8080/
          test "$(docker exec csag-demo id -u)" != "0"
          docker stop csag-demo

      - name: Demo container logs
        if: failure()
        run: docker logs csag-demo || true
